# ─── 开发环境 ───
# 登录策略：真实身份来自企微客服（external_userid → JWT → 小程序卡片 token），小程序侧不做 wx.login。
# 开发时关闭鉴权，直开小程序用 mock 用户即可全功能联调；生产（application.yml）保持开启走企微卡片 token。
xiaoliao:
  auth:
    enabled: false
    mock-user-id: 7764978f-9019-4b2f-b6b1-11862c1a5528
  wx:
    # 小程序测试号（预留：将来若要启用 wx.login 直开登录再使用）
    appid: wx4e429afa4c177a40
    secret: 27048287aadd42a9cc247c39a07587b0
  security:
    # 敏感字段加密密钥（dev 固定值；生产用环境变量 XIAOLIAO_DATA_KEY）
    data-key: xiaoliao-dev-data-key-2026
  pexels:
    # Pexels 图库 API Key（dev 固定值；生产用环境变量 XIAOLIAO_PEXELS_KEY）
    key: iIZKWKhDP2KRkvhjqja7xKugWl1GggoDW5uRSYqVqMRFXXKSGhmWe1BY
  ai:
    # 本地 AI 引擎 .env 里的 API_TOKEN（生产用环境变量 AI_API_TOKEN 注入）
    api-token: f5y2I6nxDg22K3yEHEU32dLqLX3AQILzMOSLZ4Yx4m77zERYRaXMH1FFBZQQaunY
  asr:
    # 语音识别 Key（与 AI 引擎共用阿里云百炼账号；生产用环境变量 QWEN_API_KEY 注入，不要直接提交到生产）
    api-key: "sk-ws-H.PMMEDXH.e76M.MEUCIGrVn8qZdb5_4GfggiMSjaOflfZJj0O6bcxaZRoMP--dAiEA1JzyYbDXrk5pdGza9zsH3swpAW69wptGaiMx6cnl4i0"
  deepseek:
    # DeepSeek Key（原来内嵌在小程序/网页前端，现收归后端；生产用环境变量 DEEPSEEK_API_KEY 覆盖）
    api-key: "sk-24383836e4be472c814980a63b99c4fb"

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:xiaoliao}
    username: ${DB_USER:xiaoliao}
    password: ${DB_PASSWORD:xiaoliao_dev}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 开发时打印 SQL
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.xiaoliao: DEBUG
    me.chanjar.weixin: DEBUG

