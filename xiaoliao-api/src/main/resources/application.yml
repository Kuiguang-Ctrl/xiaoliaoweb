server:
  port: 8080

spring:
  application:
    name: xiaoliao-api

  profiles:
    active: dev

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── 小辽自定义配置 ───
xiaoliao:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8081}
    connect-timeout: 3s
    read-timeout: 15s
  jwt:
    secret: ${XIAOLIAO_JWT_SECRET:xiaoliao-dev-secret-change-in-production-2026}
    expire-hours: 168
  auth:
    # 鉴权开关：true=正式校验 token；false=跳过（仅联调用，配 mock-user-id）
    enabled: true
    mock-user-id: ""

# ─── springdoc-openapi 配置（Knife4j 底层使用） ───
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.xiaoliao.api.controller

# ─── Knife4j 配置 ───
knife4j:
  enable: true
  setting:
    language: zh_cn

# ─── 企业微信（敏感信息通过环境变量注入） ───
wecom:
  corp-id: ${WECOM_CORP_ID:}
  secret: ${WECOM_SECRET:}
  token: ${WECOM_TOKEN:}
  aes-key: ${WECOM_AES_KEY:}
  kf:
    open-kfid: ${WECOM_KF_OPEN_KFID:}
  miniprogram:
    appid: ${WECOM_MINIPROGRAM_APPID:}
