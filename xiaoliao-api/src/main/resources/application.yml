server:
  port: 8080

spring:
  application:
    name: xiaoliao-api

  profiles:
    active: dev

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 上传大小：视频作品素材包（≤5 张照片 + 离线渲染配乐 wav 最大约 2MB）需要超过默认 1MB/10MB
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

  # ─── 小辽自定义配置 ───
xiaoliao:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8081}
    connect-timeout: 3s
    # Python 引擎双模型+知识库推理约 10-15s，留足余量
    read-timeout: 60s
    # 新版 AI 引擎 Bearer Token 鉴权（与引擎 .env 的 API_TOKEN 一致）
    api-token: ${AI_API_TOKEN:}
  security:
    # 敏感字段加密密钥（生产必须用环境变量 XIAOLIAO_DATA_KEY 覆盖默认值）
    data-key: ${XIAOLIAO_DATA_KEY:xiaoliao-dev-data-key-2026}
  upload:
    # 图片上传本地磁盘目录（生产用环境变量 XIAOLIAO_UPLOAD_DIR 覆盖）
    dir: ${XIAOLIAO_UPLOAD_DIR:./uploads}
    # 图片访问基础地址（生产替换为正式 https 域名）
    base-url: ${XIAOLIAO_UPLOAD_BASE_URL:http://localhost:8080}
  # 视频作品合成（M4VideoComposer 调用 ffmpeg）
  ffmpeg:
    # ffmpeg 可执行文件路径：默认用 PATH 里的 ffmpeg；Windows 可填本地绝对路径，如 C:/ffmpeg/bin/ffmpeg.exe
    path: ${XIAOLIAO_FFMPEG_PATH:ffmpeg}
  pexels:
    # Pexels 图库 API Key（免费申请 https://www.pexels.com/api/；为空时配图只走本地素材库）
    key: ${XIAOLIAO_PEXELS_KEY:}
  # 语音识别（阿里云百炼 qwen3-asr-flash，音频 base64 直传；与 AI 引擎共用 QWEN_API_KEY，按音频时长计费）
  asr:
    api-key: ${QWEN_API_KEY:}
    model: ${ASR_MODEL:qwen3-asr-flash}
    http-url: ${ASR_HTTP_URL:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
    # 单次识别超时（录音最长 60s，给足余量）
    timeout: 90s
  # 文生图（阿里云百炼 qwen-image；api-key 留空时回退用 asr 的同一把百炼 Key）
  image:
    api-key: ${XIAOLIAO_IMAGE_KEY:${xiaoliao.asr.api-key:}}
    model: ${IMAGE_MODEL:qwen-image}
    http-url: ${IMAGE_HTTP_URL:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
    # 单次生成超时
    timeout: 60s
    # 输出尺寸：1280*720 / 720*1280 / 1024*1024
    size: ${IMAGE_SIZE:1280*720}
  # DeepSeek 对话（前端不再直连，统一走后端 /api/ai/chat；Key 走服务端环境变量）
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    http-url: ${DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
    # 与前端原直连超时一致
    timeout: 30s
  jwt:
    secret: ${XIAOLIAO_JWT_SECRET:xiaoliao-dev-secret-change-in-production-2026}
    expire-hours: 168
  auth:
    # 鉴权开关：true=正式校验 token；false=跳过（仅联调用，配 mock-user-id）
    enabled: true
    mock-user-id: ""
  # 微信小程序登录（wx.login code → jscode2session → openid）
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}

# MyBatis-Plus（M2 实体逻辑删除/自动填充依赖）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ─── springdoc-openapi 配置（Knife4j 底层使用） ───
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.xiaoliao.api

# ─── 可观测性（Actuator + Prometheus，访问 /actuator/prometheus）───
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: xiaoliao-api

# ─── Knife4j 配置 ───
knife4j:
  enable: true
  setting:
    language: zh_cn

# ─── 企业微信（敏感信息通过环境变量注入） ───
wecom:
  corp-id: ${WECOM_CORP_ID:}
  secret: ${WECOM_SECRET:}
  token: ${WECOM_TOKEN:}
  aes-key: ${WECOM_AES_KEY:}
  kf:
    open-kfid: ${WECOM_KF_OPEN_KFID:}
  group-reminder:
    enabled: ${WECOM_GROUP_REMINDER_ENABLED:false}
    webhook: ${WECOM_GROUP_REMINDER_WEBHOOK:}
    cron: ${WECOM_GROUP_REMINDER_CRON:0 0 9 * * ?}
    content: ${WECOM_GROUP_REMINDER_CONTENT:现在是九点，该打卡啦～ 需要帮助可以点击群里的「客服助理」}
    webhook-content: ${WECOM_GROUP_REMINDER_WEBHOOK_CONTENT:}
    window-hours: ${WECOM_GROUP_REMINDER_WINDOW_HOURS:48}
  miniprogram:
    appid: ${WECOM_MINIPROGRAM_APPID:}
